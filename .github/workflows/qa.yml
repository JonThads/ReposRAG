name: QA

# Full testing suite gating merges into qa, per docs/claude-instructions.md
# §Actions. Two jobs: fast mocked unit tests (no live services), then a
# live end-to-end smoke test against the real docker-compose stack.
#
# Note on eval/run_eval.py: it isn't run here. Its qa_testset.json queries
# repos (clockwise, pickle-rick, tokenomics-mcp) that only exist on a
# developer's machine, not in CI — see README.md's existing "Known
# limitations" note that the eval set is hand-written and repo-specific.
# Running it against those repos in CI isn't possible without them, so the
# live-smoke job below exercises the same embed -> retrieve -> generate
# path end to end against a self-ingested fixture instead. Full DeepEval
# scoring stays a manual/local step per the README.
# [Comment] as per Jira Work Item RAG-12

on:
  pull_request:
    branches: [qa]
  push:
    branches: [qa]
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q --cov=api --cov-report=term-missing

  live-smoke:
    runs-on: ubuntu-latest
    needs: pytest
    env:
      # CI uses a small model (not the qwen2.5:3b default) to keep the
      # pull/inference time reasonable while still exercising a real,
      # unmocked Ollama call rather than stubbing generation out.
      OLLAMA_MODEL: qwen2.5:0.5b
      POSTGRES_PASSWORD: reposrag_ci_pw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies (for host-side ingestion)
        run: pip install -r requirements.txt

      - name: Install and start Ollama
        env:
          # ollama serve binds to 127.0.0.1 only by default, which is
          # unreachable from the api container via host.docker.internal
          # (the Docker bridge gateway, not loopback). 0.0.0.0 makes it
          # reachable from both the runner and the container.
          OLLAMA_HOST: 0.0.0.0
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434 >/dev/null && break
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"

      - name: Write .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgresql://reposrag:${POSTGRES_PASSWORD}@localhost:5432/reposrag
          POSTGRES_USER=reposrag
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=reposrag
          OLLAMA_HOST=http://host.docker.internal:11434
          OLLAMA_MODEL=${OLLAMA_MODEL}
          OLLAMA_MAX_RETRIES=2
          OLLAMA_RETRY_BACKOFF_SECONDS=0.5
          EMBEDDING_MODEL=all-MiniLM-L6-v2
          EMBEDDING_DIM=384
          EMBEDDING_DEVICE=cpu
          TOP_K=5
          CHUNK_SIZE_TOKENS=500
          CHUNK_OVERLAP_TOKENS=50
          API_HOST=0.0.0.0
          API_PORT=8000
          LOG_LEVEL=INFO
          API_KEY=
          RATE_LIMIT_PER_MINUTE=60
          EOF

      - name: Start db + api
        run: docker compose up -d --build db api

      - name: Wait for API health
        run: |
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "API did not become healthy in time"
            docker compose logs
            exit 1
          fi
          curl -sf http://localhost:8000/health
          echo

      - name: Ingest fixture (this repo's own docs)
        env:
          DATABASE_URL: postgresql://reposrag:${{ env.POSTGRES_PASSWORD }}@localhost:5432/reposrag
        run: python -m ingestion.ingest --source local --path . --repo-name reposrag-ci

      - name: Live query smoke test
        run: |
          curl -sf -X POST http://localhost:8000/query \
            -H "Content-Type: application/json" \
            -d '{"question": "What does ReposRAG do?", "repo": "reposrag-ci"}' \
            -o response.json || { docker compose logs; exit 1; }

          python3 - <<'PY'
          import json
          with open("response.json") as f:
              data = json.load(f)
          assert data.get("answer", "").strip(), f"empty answer: {data}"
          assert data.get("sources"), f"no sources returned: {data}"
          print("Live smoke test OK — answer:", data["answer"][:160])
          PY

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
