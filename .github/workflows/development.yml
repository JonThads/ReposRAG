name: Development

# Lint/build/boot-check on the prefixed local-development branches, per
# docs/claude-instructions.md §Actions. Never fires on qa/main directly —
# those are gated by the QA and Main pipelines instead.
# [Comment] as per Jira Work Item RAG-11

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'test/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'ci/**'
  workflow_call:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check .

      - name: Compile check
        run: python -m compileall -q api ingestion eval

      - name: Build image
        run: docker build -t reposrag-api:ci .

      - name: Boot check
        run: |
          docker run -d --name reposrag-ci-boot -p 8000:8000 \
            -e DATABASE_URL="postgresql://boot:check@localhost:5432/boot" \
            reposrag-api:ci

          ok=""
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "API did not boot in time"
            docker logs reposrag-ci-boot
            exit 1
          fi

          curl -sf http://localhost:8000/health
          echo
          docker rm -f reposrag-ci-boot
